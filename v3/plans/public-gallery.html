<title>Public Gallery</title>
<style>
  :root {
    --bg: #faf8f4;
    --panel: #ffffff;
    --ink: #1c1a16;
    --ink-soft: #5b564c;
    --line: #c9c1b2;
    --line-soft: #e4ded1;
    --accent: #1f5c3a;
    --accent-soft: #dcece2;
    --gold: #9c7a2e;
    --gold-soft: #f3ead0;
    --commons-green: #a9c6a5;
    --commons-green-line: #006443;
    --stair-fill: #d8d2c4;
    --glass-blue: #cfe6f5;
    --glass-blue-line: #4f8fb3;
    --shadow: 0 1px 2px rgba(28,26,22,0.06), 0 8px 24px rgba(28,26,22,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f;
      --panel: #211c16;
      --ink: #f1ece1;
      --ink-soft: #b9b0a0;
      --line: #4a4335;
      --line-soft: #332d24;
      --accent: #6fbf94;
      --accent-soft: #1c3327;
      --gold: #d9b869;
      --gold-soft: #362c1a;
      --commons-green: #0f4a34;
      --commons-green-line: #7fd6ae;
      --stair-fill: #332e26;
      --glass-blue: #16303f;
      --glass-blue-line: #6fb8dd;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f;
    --panel: #211c16;
    --ink: #f1ece1;
    --ink-soft: #b9b0a0;
    --line: #4a4335;
    --line-soft: #332d24;
    --accent: #6fbf94;
    --accent-soft: #1c3327;
    --gold: #d9b869;
    --gold-soft: #362c1a;
    --commons-green: #0f4a34;
    --commons-green-line: #7fd6ae;
    --stair-fill: #332e26;
    --glass-blue: #16303f;
    --glass-blue-line: #6fb8dd;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-inline: 20px;
    padding-block: 28px;
    max-width: 1440px;
    margin: 0 auto;
  }
  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 16px;
  }
  .eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-size: clamp(24px, 4vw, 32px);
    margin: 0;
    font-weight: 600;
    text-wrap: balance;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 65ch;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .meta-row b { color: var(--ink); font-weight: 600; }
  .status-note {
    background: var(--gold-soft);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .status-note b { color: var(--ink); }

  .plan-panel {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 20px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; height: auto; min-width: 780px; color: var(--ink); }

  .seat rect { fill: var(--commons-green); stroke: var(--commons-green-line); stroke-width: 1.3; }
  .seat text { fill: var(--commons-green-line); font-family: "Source Sans 3", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .wall-dot { fill: var(--ink-soft); opacity: 0.55; }
  .wall-band { stroke: var(--ink); stroke-width: 1.2; }
  .tier-separator { stroke: var(--ink); stroke-width: 4; }
  .wall-crosshatch-bg { fill: var(--glass-blue); }
  .wall-crosshatch-line { stroke: var(--glass-blue-line); stroke-width: 0.8; opacity: 0.75; }
  .archway-jamb { stroke: var(--ink); stroke-width: 1.4; }
  .seat-acc rect { fill: var(--commons-green); stroke: var(--commons-green-line); stroke-width: 1.3; }
  .wheelchair-icon-line { fill: none; stroke: var(--commons-green-line); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .wheelchair-icon-wheel { fill: none; stroke: var(--commons-green-line); stroke-width: 1.3; }
  .wheelchair-icon-fill { fill: var(--commons-green-line); }
  .acc-label { fill: var(--commons-green-line); font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 700; letter-spacing: 0.02em; }
  .seat-group-box { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .dashed-box { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 5,4; }
  .group-label { fill: var(--ink-soft); font-size: 7.5px; font-weight: 700; letter-spacing: 0.03em; }
  .stair rect { fill: var(--stair-fill); stroke: var(--ink); stroke-width: 1.1; }
  .stair line { stroke: var(--ink); stroke-width: 0.9; opacity: 0.55; }
  .door-leaf { stroke: var(--gold); stroke-width: 2.4; }
  .door-arc { fill: none; stroke: var(--gold); stroke-width: 1.4; opacity: 0.7; stroke-dasharray: 3,3; }
  .door-label { fill: var(--ink-soft); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; }
  .left-note { fill: var(--ink-soft); font-size: 9.5px; letter-spacing: 0.08em; font-weight: 700; }
  .arrow-line { stroke: var(--ink-soft); stroke-width: 1.4; }
  .arrow-head { fill: var(--ink-soft); }
  .section-label { fill: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }

  figcaption {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 14px;
    max-width: 70ch;
  }

  @media (max-width: 640px) {
    header { gap: 4px; }
    .plan-panel { padding: 14px; }
  }
  /* ===== SURVEY LABEL STANDARD — identical in every plan =====
     Labels: Source Sans 3 Bold, 12px, black.  Seat labels: Source Sans 3 Bold, 13.5px.
     Sizes are true on-screen pixels; the script below corrects for each plan's own scale. */
  :root { --label-ink: #000000; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --label-ink: #f1ece1; } }
  :root[data-theme="dark"] { --label-ink: #f1ece1; }
  svg { --lbl-fs: 10.850px; --seat-fs: 12.206px; --ik: 0.9042; }
  svg text { font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif !important; font-weight: 700 !important; font-style: normal !important; letter-spacing: 0.04em !important; font-size: var(--lbl-fs) !important; opacity: 1 !important; }
  svg text:not(.sl):not(.seat-number):not([class*="seat"] text):not(.sl-g text) { fill: var(--label-ink) !important; }
  svg [class*="seat"] text, svg text.seat-number, svg text.sl, svg .sl-g text { font-size: var(--seat-fs) !important; letter-spacing: 0 !important; }
  svg text.acc-label.acc-label.acc-label.acc-label.acc-label.acc-label.acc-label.acc-label { fill: var(--commons-green-line) !important;  font-size: var(--seat-fs) !important; letter-spacing: 0 !important; }
  svg text.lb, svg [class*="seat"] text.lb { font-size: var(--lbl-fs) !important; letter-spacing: 0.04em !important; fill: var(--label-ink) !important; }
  /* ---- Evacuation route prototype (ILLUSTRATIVE ONLY) ---- */
  .evac-banner { border: 2px solid #c8102e; border-radius: 6px; padding: 8px 12px; margin: 0 0 10px; font: 700 13px/1.35 "Source Sans 3", system-ui, sans-serif; letter-spacing: 0.04em; color: var(--ink); background: var(--panel); }
  .evac-bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 0 0 10px; font: 600 13px/1.3 "Source Sans 3", system-ui, sans-serif; color: var(--ink); }
  .evac-bar button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .evac-bar button[aria-pressed="true"] { border-color: #c8102e; box-shadow: inset 0 0 0 1px #c8102e; }
  .evac-bar button:focus-visible { outline: 2px solid #c8102e; outline-offset: 2px; }
  .evac-key { display: inline-flex; align-items: center; gap: 6px; }
  .evac-key svg { width: 34px !important; height: 20px !important; display: inline-block; max-width: 34px !important; min-width: 0 !important; flex: none; margin: 0; }
  #evac-info { margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font: 600 14px/1.45 "Source Sans 3", system-ui, sans-serif; color: var(--ink); background: var(--panel); min-height: 3em; }
  svg .evac-arrow { fill: var(--label-ink); stroke: #c8102e; stroke-width: 2.6; stroke-linejoin: round; paint-order: stroke; pointer-events: none; }
  svg .evac-arrow.alt { fill: var(--panel); stroke: var(--label-ink); stroke-width: 2.2; }
  svg #evac { pointer-events: none; }
  svg #evac.evac-dim .evac-static { opacity: 0.16; }
  svg #evac[hidden], svg #evac-badges[hidden] { display: none; }
  svg .evac-badge circle { fill: var(--panel); stroke: #c8102e; stroke-width: 2.6; }
  svg .evac-callout-box { fill: var(--panel); stroke: #c8102e; stroke-width: 2.6; }
  svg .evac-ring { fill: none; stroke: #c8102e; stroke-width: 3.6; pointer-events: none; }
  .evac-on svg g.seat { cursor: pointer; }
  .evac-on svg g.seat:focus-visible rect { stroke: #c8102e; stroke-width: 3.4; }
  svg #evac .evac-hit { fill: transparent; stroke: none; pointer-events: all; cursor: pointer; }
  svg #evac .evac-hit:focus-visible { stroke: #c8102e; stroke-width: 3.4; outline: none; }

  /* Arrows: one style everywhere */
  svg .arrow-line { stroke: var(--label-ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; fill: none; stroke-linecap: butt; }
  svg .arrow-head { fill: var(--label-ink); stroke: none; transform-box: fill-box; transform: scale(var(--ik)); }
  svg .arrow-head.dn { transform-origin: 50% 100%; }
  svg .arrow-head.up { transform-origin: 50% 0%; }
  svg .arrow-head.lf { transform-origin: 0% 50%; }
  svg .arrow-head.rt { transform-origin: 100% 50%; }
</style>
<script>
/* Survey label standard: keeps labels at 12px and seat labels at 13.5px on screen, whatever the plan's scale. */
(function () {
  function fit() {
    var all = document.querySelectorAll('svg');
    for (var i = 0; i < all.length; i++) {
      var s = all[i], v = s.viewBox && s.viewBox.baseVal;
      if (!v || !v.width) continue;
      var w = s.getBoundingClientRect().width;
      if (!w) continue;
      var k = w / v.width;
      s.style.setProperty('--lbl-fs', (12 / k).toFixed(3) + 'px');
      s.style.setProperty('--seat-fs', (13.5 / k).toFixed(3) + 'px');
      s.style.setProperty('--ik', (1 / k).toFixed(4));
    }
  }
  function init() {
    fit();
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(fit), all = document.querySelectorAll('svg');
      for (var i = 0; i < all.length; i++) ro.observe(all[i]);
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

  var EXCL = [[548, 90, 658, 96], [965, 90, 1057, 96]];
  var CX = 1125, DY = 108, LANE10 = 70;
  var ROWS = { 488: 4, 426: 5, 364: 6, 302: 7, 240: 8, 178: 9 };
  var wrap = svg.closest('figure') || document.body;
  var on = true, sel = null, raf = 0, last = 0, flows = [], ring = null;

  function el(name, attrs) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function measure(d) { var p = el('path', { d: d, fill: 'none', stroke: 'none' }); dyn.appendChild(p); var len = p.getTotalLength(); return { p: p, len: len }; }
  function inExcl(pt) { for (var i = 0; i < EXCL.length; i++) { var q = EXCL[i]; if (pt.x > q[0] - 11 && pt.x < q[2] + 11 && pt.y > q[1] - 11 && pt.y < q[3] + 11) return true; } return false; }
  function nearBadge(pt) { for (var i = 0; i < BADGES.length; i++) { var dx = pt.x - BADGES[i][0], dy = pt.y - BADGES[i][1]; if (dx * dx + dy * dy < 19 * 19) return true; } return false; }
  function put(poly, m, s, minS) {
    if (s > m.len || s < (minS || 0)) { poly.style.display = 'none'; return; }
    var a = m.p.getPointAtLength(s), b = m.p.getPointAtLength(Math.min(m.len, s + 1));
    if (nearBadge(a) || inExcl(a)) { poly.style.display = 'none'; return; }
    var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    poly.style.display = '';
    poly.setAttribute('transform', 'translate(' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
  }
  function arrow(cls) { return el('polygon', { 'class': 'evac-arrow' + (cls ? ' ' + cls : ''), points: '-11,-8.5 10,0 -11,8.5 -5,0' }); }

  function seatBox(g) {
    var r = (g.tagName === 'rect' ? g : g.querySelector('rect')).getBoundingClientRect(), m = svg.getScreenCTM().inverse();
    function pt(x, y) { var p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(m); }
    var a = pt(r.left, r.top), b = pt(r.right, r.bottom);
    return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
  }
  function bx(g) { var r = g.querySelector('rect'); return { x: +r.getAttribute('x'), y: +r.getAttribute('y'), w: +r.getAttribute('width'), h: +r.getAttribute('height') }; }
  function labelOf(g, i) {
    if (g.classList.contains('seat-acc')) return 'Acc' + (i + 1);
    var t = g.querySelector('text'); return t ? t.textContent.trim() : '';
  }
  var TAIL = ' L 1100 70 L 1100 87 L 1128 87';
  var LEFTMAX = { 4: 11, 5: 35, 6: 57, 7: 83, 8: 109, 9: 137 };
  var SPLIT = { 4: 586, 5: 620, 6: 586, 7: 620, 8: 586, 9: 620 };
  var STAIR_L = 331, STAIR_R = 875;
  function routeFor(lab, b) {
    var cx = b.x + b.w / 2, m, bot = b.y + b.h + 2;
    var NE = ' right through the double doors in the north-east corner';
    if (/^\d+$/.test(lab)) {
      var tier = ROWS[Math.round(b.y)]; if (!tier) return null;
      var n = +lab, left = n <= LEFTMAX[tier], sx = left ? STAIR_L : STAIR_R, ly = b.y + 51;
      var go = (sx > cx) ? 'right' : 'left';
      return { desc: 'Tier ' + tier + ' — along the walkway ' + go + ' to the ' + (left ? 'left' : 'right') + ' staircase, up past Accessible Space ' + (left ? '1' : '5') + ', then' + NE,
        d: 'M ' + cx + ' ' + bot + ' L ' + cx + ' ' + ly + ' L ' + sx + ' ' + ly + ' L ' + sx + ' 70' + TAIL };
    }
    if (/^SAA\d$/.test(lab)) return { desc: 'Serjeant-at-Arms Gallery — right through the right-hand door, then along the top of the gallery and' + NE,
      d: 'M ' + cx + ' 108 L ' + cx + ' 98 L 270.6 98 L 270.6 90 L 300 90 L 300 70 L ' + STAIR_L + ' 70' + TAIL };
    if (/^(Acc|PB)\d$/.test(lab)) return { desc: (lab[0] === 'A' ? 'Accessible seating' : 'Police Bench') + ' — up to the top of the gallery, then right through the double doors in the north-east corner',
      d: 'M ' + cx + ' 108 L ' + cx + ' 70' + TAIL };
    return null;
  }
  function sprinkle(d, from, to) {
    var m = measure(d), len = m.len;
    for (var s = from; s < len - to; s += SPACING + 8) { var b = arrow(); stat.appendChild(b); put(b, m, s); }
    m.p.remove();
  }
  function drawStatic() {
    stat.textContent = '';
    sprinkle('M ' + STAIR_L + ' 539 L ' + STAIR_L + ' 70', 14, 8);
    sprinkle('M ' + STAIR_R + ' 539 L ' + STAIR_R + ' 70', 14, 8);
    sprinkle('M ' + STAIR_L + ' 70' + TAIL, 14, 14);
    sprinkle('M 165 98 L 270.6 98 L 270.6 90 L 300 90 L 300 70 L 322 70', 10, 4);
    [4, 5, 6, 7, 8, 9].forEach(function (t) {
      var ly = [0, 0, 0, 0, 539, 477, 415, 353, 291, 229][t];
      var x0 = t >= 7 ? 127 : 195, x1 = t >= 7 ? 1079 : 1011;
      sprinkle('M ' + x0 + ' ' + ly + ' L ' + (STAIR_L - 12) + ' ' + ly, 14, 6);
      sprinkle('M ' + (SPLIT[t] - 22) + ' ' + ly + ' L ' + (STAIR_L + 12) + ' ' + ly, 6, 10);
      sprinkle('M ' + (SPLIT[t] + 22) + ' ' + ly + ' L ' + (STAIR_R - 12) + ' ' + ly, 6, 10);
      sprinkle('M ' + x1 + ' ' + ly + ' L ' + (STAIR_R + 12) + ' ' + ly, 14, 6);
    });
  }

  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function clear() {
    stop(); sel = null; flows = []; dyn.textContent = ''; layer.classList.remove('evac-dim');
    var s = svg.querySelector('.evac-sel'); if (s) s.classList.remove('evac-sel');
    ring = null;
    info.textContent = 'Select any seat to see its route. Draft routes — not yet approved.';
  }
  function frame(t) {
    var dt = last ? (t - last) / 1000 : 0; last = t;
    flows.forEach(function (f) {
      f.phase = (f.phase + SPEED * dt) % (f.n * SPACING);
      for (var i = 0; i < f.n; i++) put(f.polys[i], f.m, (i * SPACING + f.phase) % (f.n * SPACING), f.minS);
    });
    raf = requestAnimationFrame(frame);
  }
  function addFlow(d, cls, minS) {
    var m = measure(d), n = Math.ceil(m.len / SPACING) + 1, polys = [];
    for (var i = 0; i < n; i++) { var a = arrow(cls); dyn.appendChild(a); polys.push(a); }
    var f = { m: m, n: n, polys: polys, phase: 0, minS: minS || 0 };
    for (var j = 0; j < n; j++) put(polys[j], m, (j * SPACING) % (n * SPACING), f.minS);
    flows.push(f);
  }
  function choose(g) {
    if (!on) return;
    var prev = svg.querySelector('.evac-sel');
    if (prev === g) { clear(); return; }
    clear();
    var lab = g.getAttribute('data-lab'), b = bx(g), rt = routeFor(lab, b); if (!rt) return;
    g.classList.add('evac-sel'); sel = g;
    layer.classList.add('evac-dim');
    ring = el('rect', { 'class': 'evac-ring', x: b.x - 2, y: b.y - 2, width: b.w + 4, height: b.h + 4, rx: 4 });
    dyn.appendChild(ring);
    addFlow(rt.d, '', 0);
    info.textContent = (/^\d+$/.test(lab) ? 'Seat ' : '') + lab + ' (' + rt.desc + '). (Draft proposal — not yet approved.)';
    if (!reduce) { last = 0; raf = requestAnimationFrame(frame); }
  }

  var seats = svg.querySelectorAll('g.seat');
  var accI = 0;
  Array.prototype.forEach.call(seats, function (g) {
    var lab = labelOf(g, accI); if (g.classList.contains('seat-acc')) accI++;
    if (!lab || !routeFor(lab, bx(g))) return;
    g.setAttribute('data-lab', lab);
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', 'Seat ' + lab + ': show evacuation route');
    g.addEventListener('click', function (e) { e.stopPropagation(); choose(g); });
    if (g.classList.contains('seat-acc')) {
      var bb = bx(g), ov = el('rect', { 'class': 'evac-hit', x: bb.x, y: bb.y, width: bb.w, height: bb.h, rx: 4 });
      ov.addEventListener('click', function (e) { e.stopPropagation(); choose(g); });
      layer.appendChild(ov);
    }
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(g); } });
  });
  svg.addEventListener('click', function () { if (sel) clear(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sel) clear(); });

  function setOn(v) {
    on = v; toggle.setAttribute('aria-pressed', v ? 'true' : 'false');
    toggle.textContent = 'Evacuation routes: ' + (v ? 'on' : 'off');
    layer.style.display = v ? '' : 'none';
    wrap.classList.toggle('evac-on', v);
    hint.style.display = v ? '' : 'none'; info.style.display = v ? '' : 'none';
    if (!v) clear();
  }
  toggle.addEventListener('click', function () { setOn(!on); });
  function init() { drawStatic(); setOn(true); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
